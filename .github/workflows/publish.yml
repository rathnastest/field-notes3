name: Publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: '3 13 * * *'
      timezone: 'UTC'
  workflow_dispatch:

concurrency:
  group: gala-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    uses: rathnasgala/publish/.github/workflows/publish.yml@v1
    with:
      operation: build
      mode: build-and-deploy
      site-id: 01M16QX855WV442W0AHYVEE00A
      api-base-url: https://api.gala67.com
      output-directory: _site
      timezone: UTC
      config-path: site.config.yml
      floor-guard-percent: ${{ vars.GALA_FLOOR_GUARD_PERCENT || '20' }}
      floor-guard-pages: ${{ vars.GALA_FLOOR_GUARD_PAGES || '25' }}
      keepalive-threshold-days: ${{ vars.GALA_KEEPALIVE_THRESHOLD_DAYS || '50' }}
      floor-guard-override-commit-sha: ${{ contains(github.event.head_commit.message || '', 'Gala-Floor-Override:') && github.sha || '' }}
    secrets:
      site-secret: ${{ secrets.GALA_SITE_SECRET }}
      previous-site-secret: ${{ secrets.GALA_PREVIOUS_SITE_SECRET }}
